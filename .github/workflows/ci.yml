name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acra_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/acra_db
      SECRET_KEY: ci-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        working-directory: backend
        # Install from the lock, not requirements.txt, so CI resolves the same transitive
        # versions the containers do (ACR-42 / A10-4).
        run: pip install -r requirements.lock

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=85

  frontend:
    name: Frontend Tests, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Jest unit tests (coverage gated — see frontend/jest.config.ts)
        working-directory: frontend
        run: npm run test:coverage

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e-playwright:
    name: Playwright E2E (containerized stack)
    runs-on: ubuntu-latest

    # Distinct project, ports, AND container names so this job can never collide with a stack a
    # developer or another CI run already has up — the full pattern `scripts/compose-smoke.sh`
    # documents. Ports alone are not enough: every service in docker-compose.yml pins an explicit
    # `container_name:`, which Compose treats as a literal, un-namespaced-by-`-p` identity — hence
    # the ACRA_*_CONTAINER overrides alongside the ACRA_*_PORT ones.
    env:
      COMPOSE_PROJECT: ci-e2e
      ACRA_DB_PORT: 5633
      ACRA_BACKEND_PORT: 8200
      ACRA_FRONTEND_PORT: 3200
      ACRA_DB_CONTAINER: acra-pg-ci-e2e
      ACRA_MIGRATE_CONTAINER: acra-migrate-ci-e2e
      ACRA_BACKEND_CONTAINER: acra-backend-ci-e2e
      ACRA_FRONTEND_CONTAINER: acra-frontend-ci-e2e

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bring up the stack (db -> migrate -> backend -> frontend)
        run: docker compose -p "$COMPOSE_PROJECT" up -d --wait --build

      - name: Diagnose stack bring-up failure
        if: failure()
        run: |
          docker compose -p "$COMPOSE_PROJECT" ps
          docker compose -p "$COMPOSE_PROJECT" logs --tail 100

      - name: Seed demo data (scale-1 fixture the specs assume)
        run: docker compose -p "$COMPOSE_PROJECT" --profile seed run --rm -T seed

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:${{ env.ACRA_FRONTEND_PORT }}
          E2E_API_URL: http://localhost:${{ env.ACRA_BACKEND_PORT }}
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Tear down the stack
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT" --profile seed down -v --remove-orphans
