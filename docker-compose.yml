# ACRA MES — full local stack (ACR-42 / A10-1).
#
#   docker compose up -d --build                    Postgres + migrations + API + web
#   docker compose --profile seed run --rm seed     load demo data (opt-in)
#   docker compose down -v                          stop and wipe the database volume
#
# Every published host port is overridable, because this repo is routinely checked out into several
# worktrees at once and the documented ports are frequently already taken:
#
#   ACRA_DB_PORT=5442 ACRA_BACKEND_PORT=8042 ACRA_FRONTEND_PORT=3042 \
#     docker compose -p acr42 up -d --build
#
# Changing ACRA_BACKEND_PORT requires a frontend REBUILD, not just a restart — see the
# NEXT_PUBLIC_API_URL note on the frontend service.

services:
  db:
    image: postgres:15
    # Overridable so a second worktree (or a host that already has 5433 taken by an
    # unrelated stack) can bring this up without editing a tracked file. Defaults are
    # the documented ones, so the plain `docker compose up -d` is unchanged.
    container_name: ${ACRA_DB_CONTAINER:-acra-postgres}
    environment:
      POSTGRES_DB: acra_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${ACRA_DB_PORT:-5433}:5432"
    volumes:
      - acra-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d acra_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: bring the schema to head, then exit 0. The API waits on this completing
  # successfully, so a failed migration surfaces as a migration failure rather than as a confusing
  # cascade of 500s from a half-migrated app.
  migrate:
    build:
      context: ./backend
    image: acra-backend:local
    container_name: ${ACRA_MIGRATE_CONTAINER:-acra-migrate}
    command: ["alembic", "upgrade", "head"]
    environment:
      # alembic/env.py:16 reads os.environ["DATABASE_URL"] directly — KeyError without it.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/acra_db
    # Inherited from the backend image, which curls /health — a server this one-shot job never
    # starts. Harmless (it exits long before start-period) but it reports "unhealthy" in
    # `docker compose ps`, which is a misleading thing for a migration job to say.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    image: acra-backend:local
    container_name: ${ACRA_BACKEND_CONTAINER:-acra-backend}
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/acra_db
      SECRET_KEY: ${SECRET_KEY:-dev-only-compose-secret-change-me}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      # The origin the BROWSER sends, which is the published host port — not the internal 3000.
      # A mismatch here shows up as every XHR being CORS-blocked.
      CORS_ORIGINS: http://localhost:${ACRA_FRONTEND_PORT:-3000}
      # Optional; only the OCR path needs them.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "${ACRA_BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        # BUILD-time, and baked into the browser bundle — see frontend/Dockerfile. This is the URL
        # the user's browser resolves, so it is localhost + the PUBLISHED port, never
        # http://backend:8000. Changing it requires `--build`, not just `up`.
        NEXT_PUBLIC_API_URL: http://localhost:${ACRA_BACKEND_PORT:-8000}
    image: acra-frontend:local
    container_name: ${ACRA_FRONTEND_CONTAINER:-acra-frontend}
    environment:
      # RUNTIME, server-side only (app/api/auth/*), so it resolves over the compose network.
      BACKEND_URL: http://backend:8000
    ports:
      - "${ACRA_FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  # Opt-in demo data: `docker compose --profile seed run --rm seed`.
  # Behind a profile so `docker compose up` can never silently repopulate a database in use.
  seed:
    profiles: ["seed"]
    build:
      context: ./backend
    image: acra-backend:local
    command: ["python", "scripts/seed_fake_data.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/acra_db
    # Same reason as `migrate`: this is a one-shot job, not a server.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  acra-postgres-data:
